name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The installer writes to home directories and creates symlinks, and the
    # rules for both differ per OS -- Windows refuses symlinks without
    # Developer Mode, macOS puts home somewhere else. Testing on one OS would
    # only prove the installer works on that one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # tools/diag/harness.lua loads the diagnostics addon under a stubbed WoW
      # API. Without an interpreter that test skips, and a load-order break in
      # the addon would reach main unnoticed.
      - name: Lua interpreter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q

      - name: Bootstrap script runs
        if: runner.os != 'Windows'
        run: ./install.sh list

      - name: Bootstrap script runs (Windows)
        if: runner.os == 'Windows'
        run: .\install.ps1 list

      - name: Install end to end, then uninstall
        run: |
          uv run --python ${{ matrix.python }} python -m wow_tools install --harness codex,claude-code,kiro --skills all --yes
          uv run --python ${{ matrix.python }} python -m wow_tools status
          uv run --python ${{ matrix.python }} python -m wow_tools uninstall --harness codex,claude-code,kiro --skills all --yes

      # Addons go to a path that has to be discovered rather than looked up, so
      # the end-to-end check builds a game tree and points the installer at it
      # through the same environment variable a real user would use.
      - name: Install an addon into a fake game tree
        shell: bash
        run: |
          export WOW_ADDONS_DIR="$PWD/fake-wow/World of Warcraft/_retail_/Interface/AddOns"
          mkdir -p "$WOW_ADDONS_DIR"
          uv run --python ${{ matrix.python }} python -m wow_tools install --addons all --yes
          uv run --python ${{ matrix.python }} python -m wow_tools status --wow-addons "$WOW_ADDONS_DIR"
          test -f "$WOW_ADDONS_DIR/EllesmereUISecretsDiag/EllesmereUISecretsDiag.toc"
          uv run --python ${{ matrix.python }} python -m wow_tools uninstall --addons all --yes
          test ! -e "$WOW_ADDONS_DIR/EllesmereUISecretsDiag"

  lint:
    runs-on: ubuntu-latest
    steps:
      # The comment budget is scoped to the lines a change adds, so it needs
      # the base commit present. A shallow clone has no merge base to diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run python tools/lint/lua_comments.py

